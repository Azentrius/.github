# SPDX-License-Identifier: Apache-2.0
name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the open issues first. This issue is public: leave out host names, credentials
        and other private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that the project does not help with, or what stops you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should it show or do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you have considered.
  - type: dropdown
    id: help
    attributes:
      label: Would you help?
      options:
        - "Yes, with a pull request"
        - "Yes, by testing it"
        - "No"
    validations:
      required: false
